# Play Protect test build for a direct Install button (owner's request after 2.0.1): the current app built with
# -PdirectInstall (REQUEST_INSTALL_PACKAGES and an Install button that hands the downloaded update to Android's
# installer), signed with the release key, published as a pre-release. Pre-releases are never "latest", so the in-app
# updater ignores it. Its version is <current>-direct, which sorts before the release, so the release is offered to it.
name: test-builds

on:
  workflow_dispatch:
    inputs:
      delete_only:
        description: "Only delete the test pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_CERT_SHA256: d7883cfc24f1cb62db989086d69d217beed109b5b84164ff5394ad9e3e0bb921
  TAG: direct-install-test

jobs:
  delete:
    if: ${{ inputs.delete_only }}
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag

  test-apk:
    if: ${{ !inputs.delete_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/cache@v4
        with:
          path: |
            engine/.dl
            engine/embedded/android/.dl
          key: on-device-engine-${{ hashFiles('engine/scripts/fetch-dwsim.sh', 'engine/embedded/android/prepare.sh') }}
      - name: Prepare the on-device engine (DWSIM + .NET runtime for Android)
        run: engine/embedded/android/ci-prepare.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWSTEAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "FLOWSTEAD_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build the direct-install test APK
        working-directory: android
        env:
          FLOWSTEAD_KEYSTORE_PASSWORD: ${{ secrets.FLOWSTEAD_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PdirectInstall
          cp app/build/outputs/apk/release/app-release.apk ../flowstead-direct-install-test.apk
      - name: Check the signature, version and permission
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          f=flowstead-direct-install-test.apk
          "$apksigner" verify --print-certs "$f" | grep -qi "certificate SHA-256 digest: $RELEASE_CERT_SHA256" || { echo "::error::Not signed with the release key."; exit 1; }
          "$aapt" dump badging "$f" | grep -E "^package:"
          "$aapt" dump permissions "$f" | grep -q REQUEST_INSTALL_PACKAGES || { echo "::error::The test build lacks the install permission."; exit 1; }
          sha256sum "$f" > "$f.sha256"
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f "$RUNNER_TEMP/release.p12"
          notes="Test build, not for general use: Flowstead with a direct Install button for updates (it holds Android's install-unknown-apps permission). Install it, see whether Play Protect passes it, then let it offer the current release and tap Install. Commit ${GITHUB_SHA}."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" flowstead-direct-install-test.apk flowstead-direct-install-test.apk.sha256 \
            --prerelease --latest=false --target "$GITHUB_SHA" --title "Direct-install test build" --notes "$notes"
