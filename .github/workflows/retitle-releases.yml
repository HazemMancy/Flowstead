# One-off (D70): gives the 1.8.0–1.8.2 GitHub releases the Flowstead name: title, notes (docs/release-notes) and
# asset names, with fresh checksum files. Removed again once it has run.
name: retitle-releases

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_CERT_SHA256: d7883cfc24f1cb62db989086d69d217beed109b5b84164ff5394ad9e3e0bb921

jobs:
  retitle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Retitle, reword and rename
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          for TAG in v1.8.0 v1.8.1 v1.8.2; do
            version="${TAG#v}"
            commit=$(gh api "repos/$repo/releases/tags/$TAG" --jq .target_commitish)
            # Assets: rename every file whose name carries the interim name.
            gh api "repos/$repo/releases/tags/$TAG" --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
              new=$(echo "$name" | sed -E 's/^[a-z]+-v/flowstead-v/')
              [ "$new" = "$name" ] && continue
              if [[ "$name" == *.sha256 ]]; then
                gh api -X DELETE "repos/$repo/releases/assets/$id"
              else
                gh api -X PATCH "repos/$repo/releases/assets/$id" -f name="$new" >/dev/null
              fi
            done
            apk="flowstead-${TAG}.apk"
            # A fresh checksum file naming the renamed APK.
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$apk.sha256"; then
              gh release download "$TAG" -p "$apk" -O "$apk" --clobber
              sha256sum "$apk" > "$apk.sha256"
              gh release upload "$TAG" "$apk.sha256" --clobber
            fi
            news="$(cat "docs/release-notes/${TAG}.md")"
            cat > notes.md <<NOTES
          Flowstead ${TAG} (app version ${version}).

          ${news}

          **Install:** download \`${apk}\` on your Android phone (Android 8.0 or newer, 64-bit), open it and allow installing from this source.

          **Coming from a 0.x test build?** Those were signed with the public debug key and this release is signed with the release key, so Android can't install it over them: export each project you want to keep (project menu → Export DWSIM file), uninstall the old app, install this one and import the files (Projects → Import DWSIM file). Data-sheet fields and line-sizing criteria are not part of a DWSIM file. Later releases install as updates.

          **Solves on the phone:** DWSIM runs on the device (Settings → Engine → On this phone, the default); the first solve after starting the app takes a few seconds while DWSIM loads. A remote Flowstead engine (\`docs/engine-setup.md\`) is optional.

          Release certificate SHA-256: \`${RELEASE_CERT_SHA256}\`. \`flowstead-${TAG}-mapping.txt\` de-obfuscates crash reports. Status and known limitations: \`docs/STATUS.md\`.

          Commit: ${commit}
          NOTES
            sed -i 's/^          //' notes.md
            gh release edit "$TAG" --title "Flowstead ${TAG}" --notes-file notes.md
            gh release view "$TAG" --json name,assets --jq '.name + ": " + ([.assets[].name] | join(", "))'
          done
