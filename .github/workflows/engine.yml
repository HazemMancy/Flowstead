name: engine

on:
  push:
    paths: ["engine/**", "shared/**", "benchmarks/**", "deploy/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "shared/**", "benchmarks/**", "deploy/**", ".github/workflows/engine.yml"]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache the DWSIM build
        uses: actions/cache@v4
        with:
          path: engine/dwsim-bin
          key: dwsim-${{ hashFiles('engine/scripts/fetch-dwsim.sh', 'engine/native/ipopt_stub.c') }}
      - name: Build the pinned DWSIM from source
        run: engine/scripts/fetch-dwsim.sh
      - name: Build
        run: dotnet build engine/Flowstead.Engine.sln -c Release
      - name: Engine spike (headless solve)
        run: dotnet engine/src/Flowstead.Engine.Spike/bin/Release/net10.0/linux-x64/Flowstead.Engine.Spike.dll
      - name: Tests + benchmark harness
        run: dotnet test engine/Flowstead.Engine.sln -c Release --no-build --logger "console;verbosity=normal"

  docker:
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flowstead-engine engine/
      - name: Spike in container
        run: docker run --rm --entrypoint dotnet flowstead-engine /app/spike/Flowstead.Engine.Spike.dll
      - name: API smoke test in container
        run: |
          docker run -d --name eng -p 8080:8080 flowstead-engine
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 2; done
          KEY=$(docker exec eng dotnet /app/Flowstead.Engine.Api.dll keys add ci | tail -1)
          curl -fsS -H "Authorization: Bearer $KEY" localhost:8080/health
          curl -fsS -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            --data @<(python3 -c "import json;print(json.dumps(json.load(open('benchmarks/03-two-phase-flash/input.json'))['flowsheet']))") \
            localhost:8080/solve | python3 -c "import json,sys;r=json.load(sys.stdin);print(r['status'],r['objects']['feed']['properties']);assert r['status']=='converged'"
          # .dwxmz export then import, inside the container (temp files, DWSIM file I/O)
          python3 -c "import json;print(json.dumps(json.load(open('benchmarks/05-jt-valve-letdown/input.json'))['flowsheet']))" > /tmp/fs.json
          curl -fsS -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' --data @/tmp/fs.json localhost:8080/export \
            | python3 -c "import json,sys;r=json.load(sys.stdin);print('export',r['status'],len(r['data']));print(json.dumps({'data':r['data']}))" | tail -1 > /tmp/file.json
          curl -fsS -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' --data @/tmp/file.json localhost:8080/import \
            | python3 -c "import json,sys;r=json.load(sys.stdin);print('import',[o['tag'] for o in r['flowsheet']['objects']],r['warnings']);assert len(r['flowsheet']['objects'])>=3"
      - name: Container logs
        if: always()
        run: docker logs eng || true
