name: symbol-preview

# One-off: renders the store screenshots (symbols, flowsheet) and pushes them to the ci-screenshots branch, so they
# can be reviewed without downloading artifacts. Delete after review.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/cache@v4
        with:
          path: |
            engine/.dl
            engine/embedded/android/.dl
          key: on-device-engine-${{ hashFiles('engine/scripts/fetch-dwsim.sh', 'engine/embedded/android/prepare.sh') }}
      - name: Prepare the on-device engine
        working-directory: .
        run: engine/embedded/android/ci-prepare.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Render screenshots
        run: ./gradlew :app:testDebugUnitTest --tests 'app.flowstead.screenshots.StoreScreenshots'
      - name: Push to ci-screenshots
        working-directory: .
        run: |
          mkdir /tmp/shots && cp android/app/build/screenshots/*.png /tmp/shots/
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-screenshots && git rm -rfq . && cp /tmp/shots/*.png .
          git add *.png && git commit -qm "Screenshots of ${GITHUB_SHA}" && git push -f origin ci-screenshots
