# Temporary probe (DWSIM 10 trial): what dwsim.org offers for download, since the sandbox cannot reach it.
name: probe-dwsim10
on:
  push:
    branches: [claude/new-session-c28egw]
    paths: [.github/workflows/probe-dwsim10.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set -x
          curl -sSL -A "Mozilla/5.0" https://dwsim.org/download -o d.html || true
          grep -oiE 'href="[^"]+"' d.html | sort -u | head -150
          grep -oiE '(GPL|GNU|licen[sc]e|open[- ]source|patreon)[^<]{0,120}' d.html | sort -u | head -40
          curl -sSL -A "Mozilla/5.0" https://dwsim.org/ -o i.html || true
          grep -oiE '(GPL|GNU|licen[sc]e|open[- ]source|source code)[^<]{0,160}' i.html | sort -u | head -40
          grep -oiE 'href="[^"]*(github|gitlab|source|licen)[^"]*"' i.html | sort -u | head -40
